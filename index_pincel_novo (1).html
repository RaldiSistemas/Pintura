  function kbColunas(){
    const por=(st)=>OPS.filter(o=>eP(o)&&stOp(o)===st);
    const ini=o=>String((o.inicio&&o.inicio.em)||'');
    const ag=por('nao').sort((a,b)=>String(a.projeto).localeCompare(String(b.projeto))).slice(0,40);
    return [{tipo:'op',grupo:'Pintura',nome:'Pintando agora',cor:'#d4930d',itens:por('parcial').sort((a,b)=>ini(a).localeCompare(ini(b)))},
      {tipo:'op',grupo:'Pintura',nome:'Pausadas',cor:'#7a6ea8',itens:por('pausada').sort((a,b)=>ini(a).localeCompare(ini(b)))},
      {tipo:'aguard',grupo:'Pintura · fila',nome:'Aguardando',cor:COR_FILA,itens:ag}];
  }
  function kbCardAguard(o,cor){
    const cli=opClienteAmbiente(o);
    return `<button class="kc fl" style="--sc:${cor}" onclick="abrirOP('${o.id}','kanban')">
      <div class="kc-t"><span class="kc-n">${esc(o.numero)}</span>${dinaIconeOp(o)}</div>
      ${cli?`<div class="kc-cli">${esc(cli)}</div>`:''}<div class="kc-f">Projeto ${esc(o.projeto)||'—'} · não iniciada</div></button>`;
  }
  function kbCard(o,cor){
    const pausada=stOp(o)==='pausada', cli=opClienteAmbiente(o), obs=(o.obs||'').trim();
    return `<button class="kc ${pausada?'pau':''}" style="--sc:${cor}" onclick="abrirOP('${o.id}','kanban')">
      <div class="kc-t"><span class="kc-n">${esc(o.numero)}</span>
        ${obs?`<span class="kc-obs" title="Esta OP tem observação">${ALERTA_SVG}</span>`:''}
        ${pausada?'<span class="kc-pill">pausada</span>':''}${dinaIconeOp(o)}</div>
      ${obs?`<span class="kc-obs-t">${esc(obs)}</span>`:''}
      ${cli?`<div class="kc-cli">${esc(cli)}</div>`:''}
      <div class="kc-f kc-fn">${bolinhasFuncs(o)}<span>${esc(ativosResumo(o))} · desde ${fmtHora(o.inicio&&o.inicio.em)}</span></div>
      <div class="kc-tm">${fmtMin(tempoLiquido(o,new Date().toISOString()))} ${htmlLeadMini(o)}</div>
    </button>`;
  }
  function kbCardLote(g){
    const projs=[...g.projs];
    return `<button class="kc fl" style="--sc:${COR_FILA}" data-lote="${esc(g.lote)}" onclick="abrirLoteFila(this.dataset.lote)">
      <div class="kc-t"><span class="kc-n">Lote ${esc(g.lote)}</span></div>
      <div class="kc-cli">${projs.length?projs.length+' projeto(s): '+esc(projs.join(', ')):'—'}</div>
      <div class="kc-f">agrupado ${fmtHora(g.em)} · ${filaHa(g.em)}</div>
      ${g.feitas<g.total?`<div class="kc-f">${g.feitas}/${g.total} OPs de agrupamento apontadas</div>`:''}
      <div class="kc-dica">Toque para ver clientes e ambientes</div>
    </button>`;
  }
  function kbCardRolete(p){
    const cli=p.clientes.join(' / '), amb=p.ambientes.join(', ');
    return `<div class="kc fl" style="--sc:${COR_FILA}">
      <div class="kc-t"><span class="kc-n">Projeto ${esc(p.projeto)}</span><span class="kc-pill">Lote ${esc(p.lote)}</span>${dinaIconeProj(p.projeto)}</div>
      ${(cli||amb)?`<div class="kc-cli">${esc([cli,amb].filter(Boolean).join(' · '))}</div>`:''}
      <div class="kc-f">usinado ${fmtHora(p.em)} · ${filaHa(p.em)}</div>
    </div>`;
  }
  const KB_VAZIO={aguard:'Nenhuma OP de pintura aguardando',op:'Nada nesta coluna',agrupados:'Nenhum lote aguardando o corte',rolete:'Nenhum projeto aguardando a montagem'};
  function telaKanban(){
    topoPrincipal();
    const kOld=document.getElementById('kb'), nOld=document.getElementById('kbNav');
    const sx=kOld?kOld.scrollLeft:0, sn=nOld?nOld.scrollLeft:0;
    const cols=kbColunas();
    const nAnd=OPS.filter(o=>eP(o)&&stOp(o)==='parcial').length, nPau=OPS.filter(o=>eP(o)&&stOp(o)==='pausada').length;
    const haAlgo=cols.some(c=>c.itens.length);
    v.innerHTML=!haAlgo
      ? `<div class="vazio"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>
          <b>Nenhuma pintura por aqui</b><span>As OPs de pintura iniciadas, pausadas e aguardando aparecem aqui.</span></div>`
      : `<div class="kb-res"><b>${nAnd}</b> em andamento${nPau?` · <b>${nPau}</b> pausada${nPau>1?'s':''}`:''}</div>
        <div class="kb-nav" id="kbNav">${cols.map((c,i)=>`<button class="kb-chip ${i===0?'on':''}" style="--sc:${c.cor}" onclick="kbIr(${i})">
          <i></i>${esc(c.nome)}<b>${c.itens.length}</b></button>`).join('')}</div>
        <div class="kb" id="kb" onscroll="kbSync()">${cols.map(c=>`
          <div class="kb-col ${c.tipo==='op'?'':'fila'}" style="--sc:${c.cor}">
            <div class="kb-h"><div class="kb-g">${esc(c.grupo)}</div>
              <div class="kb-l"><span>${iconeAtiv(c.nome)}${esc(c.nome)}</span><span class="kb-q">${c.itens.length}</span></div></div>
            <div class="kb-b">${c.itens.length
              ? c.itens.map(x=>c.tipo==='op'?kbCard(x,c.cor):c.tipo==='aguard'?kbCardAguard(x,c.cor):(c.tipo==='agrupados'?kbCardLote(x):kbCardRolete(x))).join('')
              : `<div class="kb-vz">${KB_VAZIO[c.tipo]||''}</div>`}</div>
          </div>`).join('')}</div>`;
    const kb=document.getElementById('kb'), nv=document.getElementById('kbNav');
    if(kb&&sx) kb.scrollLeft=sx;
    if(nv&&sn) nv.scrollLeft=sn;
    kbSync();
  }
  function kbIr(i){
    const kb=document.getElementById('kb'); if(!kb) return;
    const c=kb.children[i]; if(!c) return;
    kb.scrollTo({left:Math.max(0,c.offsetLeft-14),behavior:'smooth'});
  }
  function kbSync(){
    const kb=document.getElementById('kb'), nv=document.getElementById('kbNav'); if(!kb||!nv) return;
    let ativo=0, melhor=1e9;
    [...kb.children].forEach((c,i)=>{ const d=Math.abs(c.offsetLeft-14-kb.scrollLeft); if(d<melhor){ melhor=d; ativo=i; } });
    [...nv.children].forEach((b,i)=>{
      const on=i===ativo;
      if(on!==b.classList.contains('on')){ b.classList.toggle('on',on);
        if(on) nv.scrollTo({left:b.offsetLeft-14,behavior:'smooth'}); }
    });
  }
  // Detalhe do lote: todos os projetos, clientes e ambientes
  function abrirLoteFila(lote){
    lote=String(lote||'').trim();
    const projs=new Map();
    const add=r=>{ const p=String(r.projeto||'').trim(); if(!p) return;
      const x=projs.get(p)||{projeto:p,clientes:new Set(),ambientes:new Set()};
      if(r.cliente) x.clientes.add(String(r.cliente).trim());
      if(r.ambiente) x.ambientes.add(String(r.ambiente).trim());
      projs.set(p,x); };
    PAINEL.filter(r=>String(r.lote||'').trim()===lote).forEach(add);
    OPS.filter(o=>loteDaOP(o)===lote).forEach(o=>{
      (o.projetosLote||[]).forEach(r=>{ if(r) add(r); });
      if(o.projeto&&!(o.projetosLote||[]).length) add({projeto:o.projeto});
    });
    const lista=[...projs.values()].sort((a,b)=>a.projeto.localeCompare(b.projeto,undefined,{numeric:true}));
    const totAmb=lista.reduce((n,x)=>n+x.ambientes.size,0);
    document.getElementById('sheetT').textContent='Lote '+lote;
    document.getElementById('sheetB').innerHTML=lista.length
      ? `<p class="lf-r">${lista.length} projeto(s) · ${totAmb} ambiente(s)</p>`+lista.map(x=>`<div class="lf">
          <div class="lf-n">Projeto ${esc(x.projeto)}</div>
          <div class="lf-c">${esc([...x.clientes].join(' / ')||'Cliente não informado')}</div>
          ${x.ambientes.size?`<ul>${[...x.ambientes].map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'<div class="kc-f">Ambiente não informado</div>'}
        </div>`).join('')
      : '<p class="lf-r">Nenhum projeto encontrado para este lote.</p>';
    document.getElementById('sheet').classList.add('on');
  }
  function fecharSheet(){ document.getElementById('sheet').classList.remove('on'); }

  /* ===== LEITOR DE CÓDIGO DE BARRAS PELA CÂMERA =====
     A OP impressa tem 3 códigos (Code 128): o número da OP, "I"+número (início) e "F"+número (fim).
     Qualquer um deles abre a OP aqui. Nada é iniciado/encerrado sozinho: o operador confere quem executa e confirma. */
  const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  const ZXING_SRI='';   // opcional: cole aqui o hash "sha384-..." da biblioteca (ver instruções na entrega)
  let scan={on:false,stream:null,det:null,t:0,ult:'',ultT:0,torch:false,msgT:0};
  function scanMsg(t,erro){
    const m=document.getElementById('scanMsg'); if(!m) return;
    m.textContent=t; m.classList.toggle('err',!!erro);
    clearTimeout(scan.msgT);
    if(erro) scan.msgT=setTimeout(()=>{ m.textContent='Aponte para o código de barras da OP'; m.classList.remove('err'); },2500);
  }
  function resolverCodigo(cod){
    cod=String(cod||'').trim().toUpperCase().replace(/\s+/g,'');
    let acao=null, num=cod;
    if(/^I\d+$/.test(cod)){ acao='inicio'; num=cod.slice(1); }
    else if(/^F\d+$/.test(cod)){ acao='fim'; num=cod.slice(1); }
    const ach=cod?OPS.find(x=>String(x.numero)===num):null;
    return {acao,num,op:(ach&&ach.atividade==='Pintura')?ach:null,outra:!!(ach&&ach.atividade!=='Pintura')};
  }
  function abrirOPpeloCodigo(r){
    const o=r.op, st=stOp(o);
    abrirOP(o.id,'tab');
    let dica='OP '+o.numero;
    if(r.acao==='inicio'){
      dica = st==='nao' ? 'OP '+o.numero+' — escolha quem vai executar e toque em Iniciar'
           : st==='encerrada' ? 'OP '+o.numero+' já está encerrada' : 'OP '+o.numero+' já foi iniciada';
    }else if(r.acao==='fim'){
      dica = st==='parcial' ? 'OP '+o.numero+' — confira quem está encerrando e toque em Encerrar'
           : st==='pausada' ? 'OP '+o.numero+' está pausada — retome antes de encerrar'
           : st==='encerrada' ? 'OP '+o.numero+' já está encerrada' : 'OP '+o.numero+' ainda não foi iniciada';
    }
    toast(dica);
  }
  function scanTratar(raw){
    const cod=String(raw||'').trim(); if(!cod) return false;
    const agora=Date.now();
    if(cod===scan.ult && agora-scan.ultT<2500) return false;     // mesma leitura em sequência
    scan.ult=cod; scan.ultT=agora;
    const r=resolverCodigo(cod);
    if(!r.op){ scanMsg((r.outra?'OP '+r.num+' não é de pintura':'OP '+r.num+' não encontrada'),true); if(navigator.vibrate) navigator.vibrate([80,60,80]); return false; }
    if(navigator.vibrate) navigator.vibrate(60);
    fecharScanner(); abrirOPpeloCodigo(r); return true;
  }
  function scanManual(){
    const i=document.getElementById('scanNum'); const cod=(i.value||'').trim(); if(!cod) return;
    const r=resolverCodigo(cod);
    if(!r.op){ scanMsg((r.outra?'OP '+r.num+' não é de pintura':'OP '+r.num+' não encontrada'),true); return; }
    i.value=''; fecharScanner(); abrirOPpeloCodigo(r);
  }
  async function criarDetector(){
    if(!('BarcodeDetector' in window)) return null;
    try{ const f=await BarcodeDetector.getSupportedFormats();
      return f.includes('code_128')?new BarcodeDetector({formats:['code_128']}):null; }catch(e){ return null; }
  }
  function carregarZXing(){
    if(window.ZXing) return Promise.resolve();
    return new Promise((ok,ko)=>{
      const el=document.createElement('script'); el.src=ZXING_URL; el.async=true;
      if(ZXING_SRI){ el.integrity=ZXING_SRI; el.crossOrigin='anonymous'; }
      el.onload=()=>ok(); el.onerror=()=>ko(new Error('Falha ao carregar o leitor'));
      document.head.appendChild(el);
    });
  }
  async function abrirScanner(){
    if(scan.on) return;
    scan.on=true; scan.ult=''; scan.torch=false;
    document.getElementById('scan').classList.add('on');
    document.getElementById('scanNum').value='';
    document.getElementById('scanTorch').hidden=true;
    document.getElementById('scanTorch').classList.remove('on');
    scanMsg('Abrindo a câmera...');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      scanMsg('Câmera indisponível neste navegador. Digite o número da OP abaixo.',true); return; }
    try{
      scan.stream=await navigator.mediaDevices.getUserMedia({audio:false,
        video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    }catch(e){
      scan.on&&scanMsg((e&&e.name==='NotAllowedError')
        ? 'Permita o acesso à câmera nas configurações do navegador, ou digite o número da OP abaixo.'
        : 'Não foi possível abrir a câmera. Digite o número da OP abaixo.',true);
      return;
    }
    if(!scan.on){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; return; }   // fechou enquanto pedia permissão
    const vid=document.getElementById('scanVid');
    vid.srcObject=scan.stream;
    try{ await vid.play(); }catch(e){}
    try{ const trk=scan.stream.getVideoTracks()[0], cap=trk.getCapabilities?trk.getCapabilities():{};
      if(cap&&cap.torch) document.getElementById('scanTorch').hidden=false; }catch(e){}
    scanMsg('Aponte para o código de barras da OP');
    scan.det=await criarDetector();
    if(!scan.on) return;
    if(scan.det) return scanLoopNativo();
    try{ await carregarZXing(); }catch(e){ scanMsg('Não foi possível carregar o leitor. Digite o número da OP abaixo.',true); return; }
    if(scan.on) scanLoopZXing();
  }
  async function scanLoopNativo(){
    if(!scan.on) return;
    const vid=document.getElementById('scanVid');
    if(vid.readyState>=2){
      try{ const r=await scan.det.detect(vid); if(r.length && scanTratar(r[0].rawValue)) return; }catch(e){}
    }
    if(scan.on) scan.t=setTimeout(scanLoopNativo,120);
  }
  function scanLoopZXing(){
    const vid=document.getElementById('scanVid'), cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const leitor=new ZXing.MultiFormatReader(); leitor.setHints(hints);
    (function passo(){
      if(!scan.on) return;
      if(vid.readyState>=2 && vid.videoWidth){
        const w=Math.min(960,vid.videoWidth), h=Math.round(vid.videoHeight*w/vid.videoWidth);
        cv.width=w; cv.height=h; cx.drawImage(vid,0,0,w,h);
        try{
          const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
          const r=leitor.decode(bmp);
          if(r && scanTratar(r.getText())) return;
        }catch(e){ /* nenhum código neste quadro */ }
      }
      scan.t=setTimeout(passo,140);
    })();
  }
  function scanLanterna(){
    try{ const trk=scan.stream&&scan.stream.getVideoTracks()[0]; if(!trk) return;
      scan.torch=!scan.torch;
      trk.applyConstraints({advanced:[{torch:scan.torch}]}).then(()=>{
        document.getElementById('scanTorch').classList.toggle('on',scan.torch); }).catch(()=>{ scan.torch=false; });
    }catch(e){}
  }
  function fecharScanner(){
    scan.on=false; clearTimeout(scan.t); clearTimeout(scan.msgT);
    if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; }
    const vid=document.getElementById('scanVid'); if(vid) vid.srcObject=null;
    document.getElementById('scan').classList.remove('on');
  }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&scan.on) fecharScanner(); });

  /* ---- sync ---- */
  let ligados=false;
  function ligar(){
    if(ligados) return; ligados=true;
    db.ref('painel').on('value',s=>{ PAINEL=Object.values(s.val()||{}).sort((a,b)=>(a.ordem||0)-(b.ordem||0)); render(); });
    db.ref('equipe').on('value',s=>{ EQUIPE=Object.values(s.val()||{}).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''))); render(); });
    db.ref('ops').on('value',s=>{ OPS=Object.values(s.val()||{}); render(); });
    db.ref('contadores').on('value',s=>{ CONTADORES=s.val()||{}; });
    db.ref('usuarios').on('value',s=>{ USUARIOS=Object.values(s.val()||{}).filter(u=>u&&u.email); if(vista==='kanban') render(); },()=>{});
    db.ref('dinabox').on('value',s=>{ DINA=s.val()||{}; if(vista==='kanban') render(); },()=>{});
    db.ref('leadtimes').on('value',s=>{ LEADS=s.val()||{}; render(); });
    db.ref('feriados').on('value',s=>{ FERIADOS=s.val()||{}; render(); });
    db.ref('.info/connected').on('value',s=>{ document.getElementById('off').classList.toggle('on',s.val()===false); });
  }

  /* ---- auth ---- */
  function erro(m){ document.getElementById('lgErr').textContent=m||''; }
  function traduz(c){
    const m={'auth/invalid-email':'E-mail inválido.','auth/user-not-found':'Usuário não encontrado.',
      'auth/wrong-password':'Senha incorreta.','auth/invalid-credential':'E-mail ou senha incorretos.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.',
      'auth/network-request-failed':'Sem conexão com a internet.','auth/user-disabled':'Usuário desativado.',
      'auth/unauthorized-domain':'DOM'};
    if(m[c]==='DOM') return 'Domínio não autorizado: '+location.hostname;
    return m[c]||('Não foi possível entrar. ('+(c||'?')+')'); }
  function entrar(){
    const e=(document.getElementById('em').value||'').trim(), s=document.getElementById('se').value||'';
    if(!e||!s){ erro('Preencha e-mail e senha.'); return; }
    const b=document.getElementById('lgBtn'); b.disabled=true; b.textContent='Entrando...'; erro('');
    persist.then(()=>auth.signInWithEmailAndPassword(e,s))
      .catch(x=>erro(traduz(x.code)))
      .finally(()=>{ b.disabled=false; b.textContent='Entrar'; });
  }
  function sair(){ if(confirm('Sair do aplicativo?')) auth.signOut(); }
  function mostrar(id){ ['login','app'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id)); }
  function diag(){
    const d=document.getElementById('lgDiag');
    if(location.protocol==='file:'){ d.className='lg-d err';
      d.innerHTML='<b>Arquivo aberto direto do celular.</b>O login só funciona por https. Acesse pelo endereço publicado.';
      const b=document.getElementById('lgBtn'); b.disabled=true; b.textContent='Indisponível'; return; }
    d.className='lg-d ok'; d.textContent='Conectado · '+location.hostname;
  }
  setTimeout(diag,150);
  // Abertura: a logo fica no ar o tempo do Firebase decidir se já existe sessão,
  // com um piso de 1,5s para não dar um flash feio, e um teto de 4s se a rede travar.
  (function(){
    const sp=document.getElementById('splash'); if(!sp) return;
    const t0=Date.now(); let saiu=false;
    function sair(){
      if(saiu) return; saiu=true;
      const espera=Math.max(0,3600-(Date.now()-t0));
      setTimeout(()=>{ sp.classList.add('sai'); setTimeout(()=>sp.remove(),700); },espera);
    }
    auth.onAuthStateChanged(()=>sair());
    setTimeout(sair,5500);
  })();

  auth.onAuthStateChanged(u=>{
    if(u){ ligar(); mostrar('app'); irLista(); }
    else{ const f=document.getElementById('loginForm'); if(f) f.reset(); mostrar('login'); }
  });
  // atualiza o tempo em curso a cada minuto
  setInterval(()=>{ if(vista==='op'||vista==='projeto'||vista==='kanban') render(); },60000);

  Object.assign(window,{irKanban,irAba,voltarOP,kbIr,kbSync,abrirLoteFila,fecharSheet,dinaAbrir,dinaAbrirOp,dinaViewerFechar,abrirScanner,fecharScanner,scanManual,scanLanterna,
    entrar,sair,render,irLista,listaFiltrar,htmlProjetos,limparBusca,abrirProjeto,abrirOP,iniciar,pausar,retomar,encerrar,selFunc,diag,addPend,togPend,delPend,
    addChk,togChk,delChk,iniciarExtra,finalizarExtra,htmlLead,htmlLeadMini,htmlExtra,leadStatus,leadMinOP,fmtCron,tickLead});

  // ===== PWA: service worker (instalação e atualização automática) =====
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        reg.addEventListener('updatefound',()=>{
          const nv=reg.installing;
          if(nv) nv.addEventListener('statechange',()=>{
            if(nv.state==='installed'&&navigator.serviceWorker.controller) nv.postMessage({tipo:'ativar'});
          });
        });
      }).catch(err=>console.warn('SW não registrado:',err));
    });
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(window.__recarregando) return; window.__recarregando=true; location.reload();
    });
  }
</script>
